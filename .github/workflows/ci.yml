name: BioEdge-SNN-Apex Verification CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pydantic pytest

      - name: Run 6-Pillar Unit Verification Suite
        run: pytest -v

      - name: Run 1,000-Cycle Stress Benchmark
        run: python experiments/run_benchmark.py

      - name: Run Ablation Study Verification
        run: python experiments/ablation_study.py

      - name: Run Decentralized Swarm Mesh Benchmark
        run: python src/swarm_mesh.py

      - name: Compile & Benchmark Bare-Metal C++11 MCU Firmware
        run: |
          mkdir -p build
          g++ -O3 -std=c++11 firmware/esp32_stm32_port/main.cpp -lm -o build/bio_mcu_demo
          g++ -O3 -std=c++11 firmware/esp32_stm32_port/bench_mcu.cpp -lm -o build/bio_mcu_bench
          ./build/bio_mcu_demo
          ./build/bio_mcu_bench
